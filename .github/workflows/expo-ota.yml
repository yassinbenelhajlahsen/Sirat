name: Expo OTA Update

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "!frontend/**/*.md"
      - "!frontend/*.md"
      - "!frontend/**/.gitignore"
      - "!frontend/.gitignore"
      - "!frontend/__tests__/**"
      - "!frontend/test/**"
      - "!frontend/tests/**"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test -- --ci --runInBand

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish OTA update
        working-directory: frontend
        run: eas update --platform ios --branch production --environment production --auto
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}