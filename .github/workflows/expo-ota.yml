name: Expo OTA Update

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "!frontend/**/*.md"
      - "!frontend/*.md"
      - "!frontend/**/.gitignore"
      - "!frontend/.gitignore"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish OTA update
        working-directory: frontend
        run: eas update --platform ios --branch production --environment production --auto
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
